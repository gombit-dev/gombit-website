name: Deploy

# Test, build the Docker image in CI, and deploy it to Fly.io on every push to
# main.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go vet + test
        run: |
          go vet ./...
          go test ./...

  deploy:
    name: Build image & deploy
    needs: test
    runs-on: ubuntu-latest
    # Never run two deploys at once, and don't cancel one mid-flight.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      IMAGE: registry.fly.io/gombit-website:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the Fly registry
        uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      # Build the production image in CI (with GitHub Actions layer cache so
      # unchanged Go/pnpm layers are reused) and push it to Fly's registry.
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy the built image
        run: flyctl deploy --image "$IMAGE"
